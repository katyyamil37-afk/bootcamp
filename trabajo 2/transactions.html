<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Movimientos - Alke Wallet</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body class="bg-light">
  <nav class="navbar navbar-dark bg-primary">
    <div class="container">
      <a class="navbar-brand" href="menu.html">Alke Wallet</a>
    </div>
  </nav>

  <main class="container mt-4">
    <h1>Últimos movimientos</h1>
    <p>Saldo disponible: <strong class="saldo">$100.000</strong></p>

    <div class="mb-3">
      <label for="filtro" class="form-label">Filtrar movimientos</label>
      <select id="filtro" class="form-select filtro-select">
        <option value="todos">Todos</option>
        <option value="deposito">Depósitos</option>
        <option value="envio">Envíos</option>
      </select>
    </div>

    <div class="table-responsive">
      <table class="table table-striped table-bordered">
        <thead class="table-primary">
          <tr>
            <th>Tipo</th>
            <th>Detalle</th>
            <th>Monto</th>
          </tr>
        </thead>
        <tbody id="tablaMovimientos">
          <tr class="movimiento deposito">
            <td>Depósito</td>
            <td>Depósito en cuenta</td>
            <td>+$50.000</td>
          </tr>
          <tr class="movimiento envio">
            <td>Envío</td>
            <td>Transferencia a Ana</td>
            <td>-$20.000</td>
          </tr>
          <tr class="movimiento deposito">
            <td>Depósito</td>
            <td>Depósito en cuenta</td>
            <td>+$30.000</td>
          </tr>
        </tbody>
      </table>
    </div>

    <a href="menu.html" class="btn btn-secondary">Volver al menú</a>
  </main>

  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <script src="js/script.js"></script>
</body>
</html>
