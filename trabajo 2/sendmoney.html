<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Enviar dinero - Alke Wallet</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body class="bg-light">
  <nav class="navbar navbar-dark bg-primary">
    <div class="container">
      <a class="navbar-brand" href="menu.html">Alke Wallet</a>
    </div>
  </nav>

  <main class="container mt-4">
    <div class="card p-4 shadow-sm mx-auto wallet-card">
      <h1>Enviar dinero</h1>
      <p>Saldo disponible: <strong class="saldo">$100.000</strong></p>

      <form id="sendForm">
        <div class="mb-3">
          <label for="contacto" class="form-label">Contacto</label>
          <select id="contacto" class="form-select" required>
            <option value="">Seleccione un contacto</option>
            <option value="Ana">Ana</option>
            <option value="Carlos">Carlos</option>
            <option value="María">María</option>
          </select>
        </div>
        <div class="mb-3">
          <label for="montoEnvio" class="form-label">Monto</label>
          <input type="number" class="form-control" id="montoEnvio" min="1" required>
        </div>
        <button type="submit" class="btn btn-primary">Enviar</button>
        <a href="menu.html" class="btn btn-secondary">Volver</a>
      </form>

      <hr>
      <h2 class="h5">Agregar nuevo contacto</h2>
      <div class="input-group">
        <input type="text" id="nuevoContacto" class="form-control" placeholder="Nombre del contacto">
        <button id="agregarContacto" class="btn btn-outline-primary" type="button">Agregar</button>
      </div>

      <div id="mensajeEnvio" class="alert mt-3 d-none"></div>
    </div>
  </main>

  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <script src="js/script.js"></script>
</body>
</html>
