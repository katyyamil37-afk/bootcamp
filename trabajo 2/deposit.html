<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Depósito - Alke Wallet</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body class="bg-light">
  <nav class="navbar navbar-dark bg-primary">
    <div class="container">
      <a class="navbar-brand" href="menu.html">Alke Wallet</a>
    </div>
  </nav>

  <main class="container mt-4">
    <div class="card p-4 shadow-sm mx-auto wallet-card">
      <h1>Realizar depósito</h1>
      <p>Saldo actual: <strong class="saldo">$100.000</strong></p>

      <form id="depositForm">
        <div class="mb-3">
          <label for="montoDeposito" class="form-label">Monto a depositar</label>
          <input type="number" class="form-control" id="montoDeposito" min="1" required>
        </div>
        <button type="submit" class="btn btn-success">Realizar depósito</button>
        <a href="menu.html" class="btn btn-secondary">Volver</a>
      </form>

      <div id="mensajeDeposito" class="alert mt-3 d-none"></div>
    </div>
  </main>

  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <script src="js/script.js"></script>
</body>
</html>
